<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Portulano bow crash animation prototype with a galleon impact and temporary wave spray across the page."
    >
    <title>Portulano | Bow Crash Prototype</title>
    <link rel="stylesheet" href="./bow-crash-prototype.css">
  </head>
  <body>
    <main class="prototype-shell">
      <section class="crash-scene" aria-label="Bow crash animation prototype">
        <div class="scene-bg" aria-hidden="true"></div>
        <canvas class="spray-canvas" aria-hidden="true"></canvas>

        <header class="prototype-header">
          <a class="brand" href="./index.html" aria-label="Portulano main site">
            <img src="./assets/portulano-compass.jpg" alt="">
            <span>Portulano</span>
          </a>
          <span class="prototype-label">Unlinked animation prototype</span>
        </header>

        <div class="scene-copy">
          <p class="eyebrow">Nuestra Senora de Atocha</p>
          <h1>Bow crash study.</h1>
          <p>
            A short impact effect: the ship drops into the swell, sea foam
            bursts upward, and mist travels across the viewport before clearing.
          </p>
          <button class="trigger-button" type="button">Crash the bow</button>
        </div>

        <div class="shirt-relic" aria-label="Product reference">
          <img src="./assets/atocha-back.jpg" alt="Back of the Portulano Atocha shirt">
          <span>Product stays in frame</span>
        </div>
      </section>
    </main>

    <script src="./bow-crash-prototype.js"></script>
  </body>
</html>
